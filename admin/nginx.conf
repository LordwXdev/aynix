# NGINX: the front door of Aynix
# - serves the admin panel
# - forwards /api and /socket.io to the API servers, spread across all of them (load balancing)
# - a first layer of rate limiting, before requests even reach Node
# - gzip, security headers, timeouts, request ids
# TLS (https) goes in front of this: a cloud load balancer, Cloudflare, or Caddy.

# every API server: add more lines (or let Docker/Kubernetes DNS return several) to scale out
upstream aynix_api {
    least_conn;                       # send each request to the least busy server
    server api:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;                     # reuse connections to the API (faster)
}

# live connections: the same phone must keep talking to the same server
# (needed when a weak network falls back from websocket to long polling)
upstream aynix_live {
    hash $remote_addr consistent;
    server api:3000 max_fails=3 fail_timeout=10s;
}

# a safety net against floods. it is generous on purpose: Haitian mobile carriers put
# many customers behind one IP address, so the real per-user limits live in the API
limit_req_zone $binary_remote_addr zone=per_ip:10m rate=50r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# keep the request id from the client, or make one
map $http_x_request_id $req_id {
    default $http_x_request_id;
    ''      $request_id;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # security headers. careful: NGINX drops these in any location that adds its own header,
    # so the locations below that use add_header repeat them
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location @too_many {
        default_type application/json;
        return 429 '{"error":"Too many requests, please slow down"}';
    }

    location = /gateway-health {
        access_log off;
        return 200 "ok\n";
    }

    # the API
    location /api/ {
        limit_req zone=per_ip burst=200 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many;
        proxy_pass http://aynix_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $req_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        # if one server fails before answering a GET, try another one
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    # live updates (websocket, with long polling as a fallback)
    location /socket.io/ {
        proxy_pass http://aynix_live;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    # metrics are for monitoring inside the private network, never public
    location = /metrics {
        return 404;
    }

    location ~ ^/health/ {
        proxy_pass http://aynix_api;
        access_log off;
    }

    # the admin panel: files with a hash in the name never change, cache them for a year
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
