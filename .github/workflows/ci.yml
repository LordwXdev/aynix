# CI/CD for Aynix
# on every push and pull request: check and test backend, admin panel and mobile app
# on main and on version tags (v1.2.0): also build the Docker images and publish them
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aynix
          POSTGRES_PASSWORD: aynix
          POSTGRES_DB: aynix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aynix" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://aynix:aynix@localhost:5432/aynix?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-123456
      JWT_REFRESH_SECRET: ci-only-refresh-secret-not-used-anywhere-else
      ADMIN_PHONE: "+50900000000"
      ADMIN_PASSWORD: ci-admin-password
      AUTH_RATE_LIMIT: "1000"
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # build caching: reuse downloaded packages between runs
      - run: npm ci # exact versions from the lockfile, never "npm install" in CI
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Migrations match the schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm run seed
      - name: Start the API
        run: |
          node dist/app.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3000/health/ready && exit 0; sleep 1; done
          cat api.log; exit 1
      - run: npm run smoke
      - run: npm run test:resilience
      - name: API logs (if something failed)
        if: failure()
        run: cat api.log

  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: admin } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint

  # delivery: publish ready-to-run images to GitHub's container registry
  images:
    needs: [backend, admin, mobile]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names and tags
        id: meta
        run: |
          repo=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "api=$repo-api" >> $GITHUB_OUTPUT
          echo "gateway=$repo-gateway" >> $GITHUB_OUTPUT
          # every image is tagged with its commit, so any version can be rolled back to
          tag="sha-${GITHUB_SHA::7}"
          [[ "$GITHUB_REF" == refs/tags/v* ]] && tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> $GITHUB_OUTPUT
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.api }}:${{ steps.meta.outputs.tag }},${{ steps.meta.outputs.api }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrate
          push: true
          tags: ${{ steps.meta.outputs.api }}-migrate:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: admin
          push: true
          tags: ${{ steps.meta.outputs.gateway }}:${{ steps.meta.outputs.tag }},${{ steps.meta.outputs.gateway }}:latest
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
